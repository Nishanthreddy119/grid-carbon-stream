[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcarbon"
version = "0.1.0"
description = "Real-time U.S. grid carbon-intensity pipeline: EIA -> Redpanda -> DuckDB -> Streamlit"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
